# Prefix {{{
unbind C-b
set -g prefix C-a
bind C-a send-prefix              # hit prefix twice to pass through
# }}}

# Terminal {{{
set -s escape-time 0              # no delay after Esc (default: 500)
set -s focus-events on            # lets apps (e.g. Vim autoread) detect focus changes
set -s extended-keys on           # let apps distinguish C-i/Tab, C-m/Enter
set -s extended-keys-format csi-u # Claude Code, Neovim, etc. expect this (default: xterm)
set -s set-clipboard on           # honor OSC 52 clipboard from apps

# Tell tmux what Ghostty supports. Appends (-as) to tmux's built-in list.
#   RGB        - true color (24-bit)
#   clipboard  - OSC 52 clipboard access
#   ccolour    - cursor color changes
#   cstyle     - cursor shape changes (block/beam/underline, e.g. vim insert mode)
#   title      - window title updates (for terminal tabs)
#   hyperlinks - OSC 8 clickable links
#   usstyle    - styled underlines (curly, dotted, colored)
#   extkeys    - extended key reporting (matches extended-keys above)
set -as terminal-features 'xterm-ghostty:RGB:clipboard:ccolour:cstyle:title:hyperlinks:usstyle:extkeys'
# }}}

# General behavior {{{
set -g base-index 1               # start window numbers at 1
setw -g pane-base-index 1         # match pane numbering to window numbering
set -g renumber-windows on
set -g history-limit 100000       # default: 2000
set -g mouse on
set -g set-titles on              # push window title to terminal (useful for tabs)
set -g display-time 3000          # status message duration ms (default: 750)
set -g display-panes-time 2000    # display-panes timeout ms (default: 1000)
set -g aggressive-resize on       # size per-client, not per-session (useful for pairing)
setw -g mode-keys vi              # default: emacs
setw -g monitor-activity on       # highlight windows in status bar on new output
setw -g allow-passthrough on      # let apps send escape sequences through (images, etc.)
# }}}

# Window naming {{{
# Shows directory basename when idle in shell, command name when running.
# default format: "#{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],}"
set -g automatic-rename on        # already default, explicit for clarity
set -g automatic-rename-format "#{?pane_dead,[dead],#{?pane_in_mode,[tmux],#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}}}"
# }}}

# Appearance {{{

# Status bar
set -g status-interval 5          # in seconds (default: 15)
set -g status-style "fg=cyan,bg=default"
set -g message-style "fg=yellow,bg=default,bold"
set -g status-left-length 40
set -g status-right-length 80
# Shows PREFIX badge when prefix is pressed, SYNC when panes are synchronized, and clock + date.
set -g status-right "#{?client_prefix,#[bg=cyan fg=black] PREFIX #[default],}#{?pane_synchronized,#[bg=red fg=white] SYNC #[default],} %H:%M %d-%b-%y"

setw -g window-status-current-style "fg=black,bg=cyan"
setw -g window-status-activity-style "fg=black,bg=yellow"

# Pane borders
setw -g pane-border-status top
# Shows pane number, running command, and last 40 chars of path.
setw -g pane-border-format " #P: #{pane_current_command} │ …#{=-40:pane_current_path} "
setw -g pane-border-style "fg=white,bg=default,dim"
setw -g pane-active-border-style "fg=brightcyan,bg=default,bold"
setw -g pane-border-lines heavy

# Pane indicators (prefix q)
set -g display-panes-colour brightblack
set -g display-panes-active-colour cyan

# Popups
setw -g popup-border-lines rounded

# }}}

# Navigation {{{

# Vim-style pane select (repeatable).
# l overrides default last-window (moved to Tab).
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Default pane resize bindings (not rebound, listed for reference):
#   M-Up/Down/Left/Right  resize by 5 (repeatable)
#   C-Up/Down/Left/Right  resize by 1 (repeatable)

# Window navigation (default n/p, made repeatable with -r)
bind -r n next-window
bind -r p previous-window

bind Tab  last-window             # toggle last window (default: l, which we override)
bind BTab switch-client -l        # toggle last session (also on default L)

# Reorder windows: use prefix < then l/r from the context menu.

# }}}

# Splits {{{
# Tweaked defaults: preserve the current working directory.
bind c   new-window      -c "#{pane_current_path}"
bind '"' split-window    -c "#{pane_current_path}"
bind %   split-window -h -c "#{pane_current_path}"

# Mnemonic shortcuts: \ = vertical divider, - = horizontal divider.
# `-` overrides default delete-buffer, which is rarely used.
bind -  split-window    -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
# }}}

# Copy mode (vi) {{{
# Defaults already provided by mode-keys vi (no need to rebind):
#   V        select-line           C-u      halfpage-up
#   C-v      rectangle-toggle      C-d      halfpage-down
#   /        search-forward        ?        search-backward
#   n        search-again          N        search-reverse
#   q        cancel                Space    begin-selection
#   Wheel    scroll 5 lines
#
# Our overrides:
bind -T copy-mode-vi v      send -X begin-selection            # default: rectangle-toggle
bind -T copy-mode-vi y      send -X copy-selection-and-cancel  # default: not bound
bind -T copy-mode-vi Escape send -X cancel                     # default: clear-selection
# }}}

# Misc bindings {{{
bind S setw synchronize-panes  # toggle sync across panes
bind M setw monitor-activity \; display "monitor-activity: #{monitor-activity}"  # toggle per-window
# Toggle monitor-silence: highlight window when it stops producing output for 10s.
# Useful for watching builds finish.
bind W if -F "#{monitor-silence}" "setw monitor-silence 0 ; display 'monitor-silence: off'" "setw monitor-silence 10 ; display 'monitor-silence: 10s'"
bind g display-popup -d "#{pane_current_path}" -w 80% -h 80%  # quick popup shell
bind e new-window -n 'tmux.conf' "#{EDITOR} ~/.config/tmux/tmux.conf && tmux source ~/.config/tmux/tmux.conf && tmux display 'Config reloaded'"
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"  # overrides default refresh-client
# }}}

# Plugins {{{
# TPM must stay at the bottom; `run` initializes it.
# continuum must be last plugin (it hooks into status-right).
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-logging'          # prefix+shift+p: log, alt+p: screenshot, alt+shift+p: history
set -g @plugin 'Morantron/tmux-fingers'             # prefix+F: highlight patterns, press letter to copy
set -g @plugin 'sainnhe/tmux-fzf'                   # prefix+C-f: fzf for sessions/windows/panes/keybindings
set -g @plugin 'wfxr/tmux-fzf-url'                  # prefix+u: fzf for URLs in scrollback
set -g @plugin 'tmux-plugins/tmux-resurrect'        # prefix+C-s: save, C-r: restore
set -g @plugin 'tmux-plugins/tmux-continuum'        # auto-save every N minutes, auto-restore on start

# Plugin config
set -g @logging-path '~/.tmux/logs'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'                 # minutes (default: 15)
set -g @fingers-ctrl-action 'open #{}'              # Ctrl+letter: open in browser/default app
set -g @fingers-alt-action '#{EDITOR} #{}'          # Alt+letter: open in $EDITOR
set -g @fingers-show-copied-notification '1'        # show tmux message on copy
TMUX_FZF_LAUNCH_KEY="C-f"                           # avoid conflict with fingers (default: F)

run -b '~/.tmux/plugins/tpm/tpm'
# }}}

# vim: set ft=tmux foldmethod=marker foldlevel=99:
